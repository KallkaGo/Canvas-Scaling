<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>

  <body>
    <script src="https://cdn.jsdelivr.net/npm/pica@9.0.1/dist/pica.min.js"></script>
    <canvas id="sourceCanvas"></canvas>
    <div class="container">
      <div>
        <h1>OriginalCanvas</h1>
        <canvas class="canvas" id="originalCanvas"></canvas>
      </div>
      <div>
        <h1>targetCanvas-pica </h1>
        <canvas class="canvas" id="targetCanvas"></canvas>
      </div>
      <div>
        <h1>targetImg</h1>
        <img id="targetImg">
      </div>
    </div>

    <style>
      h1{
        text-align: center;
      }
      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        position: absolute;
        gap: 20px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      #sourceCanvas {
        display: none;
      }


      img {
        width: 300px;
        height: 300px;
      }
    </style>

    <script>


      const resizer = pica()

      const sourceCanvas = document.getElementById('sourceCanvas')
      const originalCanvas = document.getElementById('originalCanvas')
      const targetCanvas = document.getElementById('targetCanvas')
      const targetImg = document.getElementById('targetImg')

      const src = './test.png'

      const width = 300
      const height = 300

      const img = new Image()
      img.src = src

      img.onload = async () => {

        sourceCanvas.width = img.width
        sourceCanvas.height = img.height

        originalCanvas.width = width
        originalCanvas.height = height

        targetImg.src = img.src

        const ctx = sourceCanvas.getContext('2d')
        ctx.drawImage(img, 0, 0)

        const ctx2 = originalCanvas.getContext('2d')
        ctx2.drawImage(img, 0, 0, width, width)

        targetCanvas.width = width
        targetCanvas.height = width

        try {

          const res = await resizer.resize(sourceCanvas, targetCanvas, {
            unsharpAmount: 200,
            unsharpRadius: 0.5,
          })
          console.log('图像缩放完成', res)
        } catch (error) {
          console.error('图像缩放失败', error)
        }
      }
    </script>
  </body>
</body>

</html>
